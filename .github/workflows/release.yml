name: Automated Release

on:
  push:
    tags:
      - "v*.*.*" # 匹配语义化版本标签，如 v1.2.3

permissions:
  contents: write
  pull-requests: read
  issues: read

jobs:
  generate-release:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Generate Official Release Notes
      uses: actions/github-script@v6
      id: official-notes
      env:
        TAG_NAME: ${{ github.ref_name }}
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      with:
        script: |
          const response = await github.rest.repos.generateReleaseNotes({
            owner: context.repo.owner,
            repo: context.repo.repo,
            tag_name: process.env.TAG_NAME,
            target_commitish: 'main',
            configuration_file_path: '.github/release.yml'
          });
          return response.data.body;

    - name: Enrich Release Notes
      id: enrich-notes
      run: |
        # 添加额外信息到环境变量
        echo "RELEASE_NOTES=${{ steps.official-notes.outputs.result }}" >> $GITHUB_ENV

        # 使用多行内容填充 RELEASE_NOTES
        echo "RELEASE_NOTES<<EOF" >> $GITHUB_ENV
        echo "${{ steps.official-notes.outputs.result }}" >> $GITHUB_ENV
        echo "" >> $GITHUB_ENV
        echo "### 📊 统计信息" >> $GITHUB_ENV
        echo "- 本次发布包含 ${{ steps.commit-count.outputs.count }} 个提交" >> $GITHUB_ENV
        echo "- 影响 ${{ steps.file-changes.outputs.files }} 个文件" >> $GITHUB_ENV
        echo "EOF" >> $GITHUB_ENV

    - name: Create Release
      uses: softprops/action-gh-release@v1
      with:
        name: "Release ${{ github.ref_name }}"
        tag_name: ${{ github.ref_name }}
        body: ${{ env.RELEASE_NOTES }}
        draft: false