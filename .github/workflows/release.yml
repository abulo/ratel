name: Auto Release with Config

on:
  push:
    tags:
      - 'v*'

jobs:
  generate-changelog:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install yq
        run: sudo snap install yq

      # 更新后的 changelog 生成步骤
      - name: Generate changelog
        id: changelog
        env:
          CONFIG_FILE: .github/release.yml
        run: |
          # 增强类型解析函数
          parse_commit_type() {
            local subject="$1"
            # 匹配两种格式：
            # 1. 类型(范围): 描述 -> 提取类型
            # 2. 类型: 描述 -> 提取类型
            echo "$subject" | sed -E 's/^([[:alnum:]]+)(\(.*\))?:.*/\1/' | tr -d ' '
          }

          # 初始化分类系统
          declare -A category_map
          echo "加载分类配置..."
          while IFS=";" read -r title labels; do
              for label in $labels; do
                  category_map[$label]="$title"
              done
          done < <(yq -o=tsv '.categories[] | [.title, (.labels | join(" "))] | join(";")' $CONFIG_FILE)

          # 获取版本信息
          mapfile -t tags < <(git tag -l --sort=-version:refname)
          current_tag=${tags[0]}
          previous_tag=${tags[1]:-}

          # 生成提交范围
          commit_range=${previous_tag:-$(git rev-list --max-parents=0 HEAD)}
          [[ -n "$previous_tag" ]] && commit_range="$previous_tag..$current_tag"
          echo "分析提交范围: $commit_range"

          # 收集提交数据
          echo "正在解析提交记录..."
          declare -A log_entries
          git log --pretty=format:"%s|%h" "$commit_range" | while IFS="|" read -r subject hash; do
              type=$(parse_commit_type "$subject")
              clean_subject="${subject#$type}"          # 移除类型部分
              clean_subject="${clean_subject#\(*\)}"    # 移除范围部分
              clean_subject="${clean_subject#:}"        # 移除剩余冒号
              entry="- ${clean_subject} (${hash:0:7})"  # 格式化条目

              found_category=""
              for pattern in "${!category_map[@]}"; do
                  if [[ "${type,,}" == "${pattern,,}" ]]; then
                      found_category="${category_map[$pattern]}"
                      break
                  fi
              done

              if [[ -z "$found_category" ]]; then
                  found_category="其他"
                  echo "未分类提交: $type => $subject"
              fi

              log_entries["$found_category"]+="$entry"$'\n'
          done

          # 构建发布说明
          echo "生成变更日志..."
          release_notes="## 📦 版本 $current_tag 更新日志\n\n"
          release_notes+="**发布日期**: $(date +'%Y-%m-%d %H:%M:%S')\n\n"

          # 按配置顺序输出分类
          yq eval '.categories[].title' $CONFIG_FILE | while read -r category; do
              [[ -n "${log_entries[$category]}" ]] && {
                  release_notes+="### ${category}\n"
                  release_notes+="${log_entries[$category]}\n"
              }
          done

          # 处理未在配置中定义的分类
          [[ -n "${log_entries[其他]}" ]] && {
              release_notes+="### 其他变更\n"
              release_notes+="${log_entries[其他]}\n"
          }

          echo -e "$release_notes" > changelog.md
          echo "最终变更日志："
          cat changelog.md

      - name: Create Release
        uses: ncipollo/release-action@v1
        with:
          generateReleaseNotes: false
          bodyFile: changelog.md
          tag: ${{ github.ref_name }}