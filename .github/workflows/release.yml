name: Create Release Tag

on:
  push:
    tags:
      - 'v*' # 推送标签，比如 v1.0, v20.15.10

jobs:
  build:
    name: 创建发布
    runs-on: ubuntu-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # 获取完整提交历史

      - name: 提取信息
        id: extractInfo
        run: |
          # 获取按版本号倒序排列的标签列表
          mapfile -t tags < <(git tag -l --sort=-version:refname)
          currentTag=${tags[0]}
          previousTag=${tags[1]:-}  # 处理无前序标签情况

          # 智能获取版本间提交记录
          if [[ -z "$previousTag" ]]; then
            commitRange=$currentTag
          else
            commitRange="$previousTag..$currentTag"
          fi

          # 提取符合约定式提交规范的记录
          commitMessages=$(git log --pretty=format:"- %s (%h)" $commitRange | grep -E '^- (feat|fix|style|format|docs|perf|init|test|refactor|patch|file|publish|tag|config|git|ci|build):')

          # 分类处理提交记录
          declare -A categoryMap=(
            [feat]="新功能"
            [fix]="问题修复"
            [style]="代码样式"
            [format]="格式调整"
            [docs]="文档更新"
            [perf]="性能优化"
            [init]="初始化"
            [test]="测试相关"
            [refactor]="代码重构"
            [patch]="紧急补丁"
            [file]="文件调整"
            [publish]="发布相关"
            [tag]="标签操作"
            [config]="配置变更"
            [git]="版本控制"
            [ci]="持续集成"
            [build]="构建系统"
          )

          # 生成变更日志
          releaseNotes="## 版本更新内容\n\n"
          for type in "${!categoryMap[@]}"; do
            filtered=$(echo "$commitMessages" | grep -E "^- ${type}:" || true)
            if [[ -n "$filtered" ]]; then
              releaseNotes+="### ${categoryMap[$type]}\n${filtered}\n\n"
            fi
          done

          # 处理未分类的提交
          others=$(echo "$commitMessages" | grep -vE "^- ($(IFS=\|; echo "${!categoryMap[*]}")):" || true)
          if [[ -n "$others" ]]; then
            releaseNotes+="### 其他变更\n${others}\n\n"
          fi

          # 输出日志文件
          echo -e "$releaseNotes" > changelog.md
          echo "生成变更日志内容："
          cat changelog.md

      - name: 创建版本发布
        uses: ncipollo/release-action@v1
        with:
          generateReleaseNotes: false  # 禁用自动生成
          bodyFile: changelog.md
          tag: ${{ github.ref_name }}  # 使用触发工作流的标签