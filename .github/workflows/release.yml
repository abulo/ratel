# .github/workflows/release.yml
name: Auto Release

on:
  push:
    tags:
      - "v*"

jobs:
  generate-release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Load config
        id: load-config
        run: |
          CONFIG_CONTENT=$(cat .github/release.yml | jq -Rs .)
          echo "config=$CONFIG_CONTENT" >> $GITHUB_OUTPUT

      - name: Generate release notes
        id: release-data
        uses: actions/github-script@v6
        env:
          TAG_NAME: ${{ github.ref_name }}
        with:
          script: |
            const yaml = require('js-yaml')

            // 从步骤输出获取配置
            const configContent = '${{ steps.load-config.outputs.config }}'
            const { categories } = yaml.load(Buffer.from(configContent, 'base64').toString())

            // 获取上一个标签
            const previousTag = await github.rest.repos.listTags({
              owner: context.repo.owner,
              repo: context.repo.repo,
              per_page: 2
            }).then(res => res.data[1]?.name || 'v0.0.0')

            // 获取提交对比
            const comparison = await github.rest.repos.compareCommits({
              owner: context.repo.owner,
              repo: context.repo.repo,
              base: previousTag,
              head: process.env.TAG_NAME
            })

            // 处理 PR 数据
            const processPr = async (commit) => {
              const prMatch = commit.commit.message.match(/\(#(\d+)\)$/)
              if (!prMatch) return null

              try {
                const pr = await github.rest.pulls.get({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  pull_number: prMatch[1]
                })
                return {
                  title: pr.data.title,
                  number: pr.data.number,
                  labels: pr.data.labels.map(l => l.name),
                  user: pr.data.user.login
                }
              } catch {
                return null
              }
            }

            // 获取所有有效 PR
            const prs = (await Promise.all(
              comparison.data.commits
                .map(processPr)
            )).filter(Boolean)

            // 分类处理
            const categorized = {}
            categories.forEach(category => {
              category.items = prs.filter(pr =>
                category.labels.some(label =>
                  label === '*' || pr.labels.includes(label)
                )
              )
              categorized[category.title] = category.items
            })

            // 贡献者统计
            const contributors = comparison.data.commits
              .filter(c => !c.author.login.includes('[bot]'))
              .reduce((acc, cur) => {
                acc[cur.author.login] = (acc[cur.author.login] || 0) + 1
                return acc
              }, {})

            // 生成最终结果
            return {
              categorized: JSON.stringify(categorized),
              contributors: JSON.stringify(
                Object.entries(contributors)
                  .sort((a, b) => b[1] - a[1])
              ),
              fileStats: comparison.data.files.length,
              commitCount: comparison.data.total_commits
            }

      - name: Create release
        uses: softprops/action-gh-release@v1
        with:
          tag_name: ${{ github.ref }}
          name: Release ${{ github.ref_name }}
          body: |
            ## What's Changed

            ${{ fromJSON(steps.release-data.outputs.result).categorized | jq -r 'to_entries[] | "### \(.key)\n\(.value | map("- \(.title) by @\(.user) in [#\(.number)](https://github.com/${{ github.repository }}/pull/\(.number))") | join("\n"))\n"' }}

            ### 👥 贡献者
            感谢这些优秀的贡献者（按提交次数排序）：
            ${{ fromJSON(steps.release-data.outputs.result).contributors | jq -r '.[] | "- @\(.[0]) (\(.[1]) 次提交)"' }}

            ### 📊 统计信息
            - 本次发布包含 ${{ fromJSON(steps.release-data.outputs.result).commitCount }} 个提交
            - 影响 ${{ fromJSON(steps.release-data.outputs.result).fileStats }} 个文件

            ---
            📅 **发布日期**: ${{ steps.release-data.outputs.date }}
            🔗 **下载统计**: ![GitHub Releases](https://img.shields.io/github/downloads/${{ github.repository }}/${{ env.TAG_NAME }}/total?style=flat-square)
