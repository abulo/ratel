# .github/workflows/release.yml
name: Auto Release

on:
  push:
    tags:
      - 'v*'

jobs:
  generate-release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Load config
        id: load-config
        run: |
          CONFIG_CONTENT=$(cat .github/release.yml | jq -Rs .)
          echo "config=$CONFIG_CONTENT" >> $GITHUB_OUTPUT

      - name: Generate release notes
        id: release-data
        uses: actions/github-script@v6
        env:
          TAG_NAME: ${{ github.ref_name }}
        with:
          script: |
            const yaml = require('js-yaml')

            // 解析配置
            const configContent = Buffer.from('${{ steps.load-config.outputs.config }}', 'base64').toString()
            const { categories } = yaml.load(configContent)

            // 获取标签对比数据
            const previousTag = await github.rest.repos.listTags({
              owner: context.repo.owner,
              repo: context.repo.repo,
              per_page: 2
            }).then(res => res.data[1]?.name || 'v0.0.0')

            // 获取提交对比
            const comparison = await github.rest.repos.compareCommits({
              owner: context.repo.owner,
              repo: context.repo.repo,
              base: previousTag,
              head: process.env.TAG_NAME
            })

            // PR 处理函数
            const processPr = async (commit) => {
              const prMatch = commit.commit.message.match(/\(#(\d+)\)$/m)
              if (!prMatch) return null

              try {
                const pr = await github.rest.pulls.get({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  pull_number: prMatch[1]
                })
                return {
                  title: pr.data.title.replace(/(^"|"$)/g, ''), // 清理标题引号
                  number: pr.data.number,
                  labels: pr.data.labels.map(l => l.name),
                  user: pr.data.user.login
                }
              } catch {
                return null
              }
            }

            // 获取有效 PR 列表
            const prs = (await Promise.all(
              comparison.data.commits.map(processPr)
            )).filter(Boolean)

            // 生成分类内容
            let releaseBody = '## What\'s Changed\n\n'
            categories.forEach(category => {
              const items = prs.filter(pr =>
                category.labels.some(label =>
                  label === '*' || pr.labels.includes(label)
                )
              )
              if (items.length === 0) return

              releaseBody += `### ${category.title}\n`
              items.forEach(item => {
                releaseBody += `- ${item.title} by @${item.user} in [#${item.number}](https://github.com/${context.repo.owner}/${context.repo.repo}/pull/${item.number})\n`
              })
              releaseBody += '\n'
            })

            // 生成贡献者统计
            const contributors = comparison.data.commits
              .filter(c => !c.author?.login?.includes('[bot]'))
              .reduce((acc, cur) => {
                const user = cur.author?.login || 'unknown'
                acc[user] = (acc[user] || 0) + 1
                return acc
              }, {})

            releaseBody += '### 👥 贡献者\n感谢这些优秀的贡献者（按提交次数排序）：\n'
            Object.entries(contributors)
              .sort((a, b) => b[1] - a[1])
              .forEach(([user, count]) => {
                releaseBody += `- @${user} (${count} 次提交)\n`
              })

            // 添加统计信息
            releaseBody += `
### 📊 统计信息
- 本次发布包含 ${comparison.data.total_commits} 个提交
- 影响 ${comparison.data.files?.length || 0} 个文件

---
📅 **发布日期**: ${new Date().toISOString().split('T')[0]}
🔗 **下载统计**: ![GitHub Releases](https://img.shields.io/github/downloads/${context.repo.owner}/${context.repo.repo}/${process.env.TAG_NAME}/total?style=flat-square)
            `.trim()

            // 返回最终内容
            return { body: releaseBody }

      - name: Create release
        uses: softprops/action-gh-release@v1
        with:
          tag_name: ${{ github.ref }}
          name: Release ${{ github.ref_name }}
          body: ${{ steps.release-data.outputs.body }}